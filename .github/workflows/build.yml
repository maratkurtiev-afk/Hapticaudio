name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: xcodebuild -project HapticAudio.xcodeproj -scheme HapticAudio -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/HapticAudio.app Payload/
          zip -r HapticAudio.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: HapticAudio.ipa
